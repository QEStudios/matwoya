{% component audio(src: string, loop = false, title = "", caption = "") -%}
{%- set audio_path = "files/" ~ src -%}
<div class="audio-container">
<audio controls {% if loop -%}loop {% endif -%} src="{{ get_url(path=audio_path) | safe }}" preload="none" {% if title -%}title="{{title}}"{% endif -%}></audio>
{%- if caption -%}
    <br /><em>{{caption}}</em>
{%- endif -%}
</div>
{%- endcomponent %}
