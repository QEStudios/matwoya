base_url = "https://QEStudios.github.io/matwoya"
title = "Matwoya"
description = "Matwoya is a fork of Mabuya, a minimal Zola theme for building light and SEO-ready blogs."
author = "SKM GEEK"

compile_sass = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
minify_html = true
build_search_index = false
taxonomies = [{ name = "tags", feed = true }]

[markdown]
smart_punctuation = true

[markdown.highlighting]
style = "inline"
theme = "gruvbox-dark-medium"
# More syntax highlighting themes: https://www.getzola.org/documentation/content/syntax-highlighting

[extra]
author = "SKM GEEK"
copyright = "© 2026"
github = "https://github.com/QEStudios"
timeformat = "%Y-%m-%d"                 # e.g. 2021-06-14

[[extra.menu]]
name = "RSS"
url = "/rss.xml"

[[extra.menu]]
name = "Atom"
url = "/atom.xml"

[[extra.menu]]
name = "Archive"
url = "/"

