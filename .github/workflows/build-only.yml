name: Build only Zola site

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  id-token: write

jobs:
  build-only:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zola-version: ["0.23.0", "0.23.4"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ matrix.zola-version }}
      - name: Build Zola
        run: zola check --drafts
        env:
          BUILD_ONLY: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
